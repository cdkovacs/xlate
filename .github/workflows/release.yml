name: Release

# Computes the next semantic version from commit history, builds the signed +
# notarized .pkg on a macOS runner, and publishes it as a GitHub Release.
#
# Version bumping (paulhatch/semantic-version, Conventional Commits defaults):
# "feat:" / "feat(scope):" in a commit subject bumps MINOR; "!:" or "BREAKING CHANGE:"
# bumps MAJOR; anything else increments the patch number. The release only runs when
# the version actually changed, or when triggered manually.

on:
#  push:
#    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # create tags + releases

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.semver.outputs.version }}
      changed: ${{ steps.semver.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # semantic-version needs full history + tags
      - id: semver
        uses: paulhatch/semantic-version@4d6da96a9bc3116da3613309a11ff75fba58eb8d # v6.0.4
        with:
          tag_prefix: "v"
          version_format: "${major}.${minor}.${patch}"
          bump_each_commit: false

  release:
    needs: version
    if: needs.version.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26        # Apple Silicon, Xcode 26 (the app needs the macOS 26 SDK)
    env:
      VERSION: ${{ needs.version.outputs.version }}
      KEYCHAIN: ${{ github.workspace }}/xlate-build.keychain-db
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Create keychain and import Developer ID identities
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          DEVID_APP_P12_BASE64: ${{ secrets.DEVID_APP_P12_BASE64 }}
          DEVID_INSTALLER_P12_BASE64: ${{ secrets.DEVID_INSTALLER_P12_BASE64 }}
        run: |
          set -euo pipefail
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"                 # no auto-lock timeout
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$DEVID_APP_P12_BASE64"       | base64 -D > app.p12
          echo "$DEVID_INSTALLER_P12_BASE64" | base64 -D > installer.p12
          security import app.p12       -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/productbuild
          security import installer.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/productbuild
          rm -f app.p12 installer.p12

          # Apple intermediate so the chain validates.
          curl -fsSL -o DeveloperIDG2CA.cer https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import DeveloperIDG2CA.cer -k "$KEYCHAIN" || true
          rm -f DeveloperIDG2CA.cer

          # Open BOTH private keys to Apple tools without a GUI prompt (fixes the
          # errSecInteractionNotAllowed that bites codesign AND productsign).
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          # Put our keychain first in the search list (keep the login keychain too).
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"

          echo "Valid signing identities:"
          security find-identity -v -p codesigning "$KEYCHAIN"

          # Extract the exact identity names so we never hardcode the org.
          APP_ID=$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -nE 's/.*"(Developer ID Application:[^"]*)".*/\1/p' | head -1)
          INST_ID=$(security find-identity "$KEYCHAIN" | sed -nE 's/.*"(Developer ID Installer:[^"]*)".*/\1/p' | head -1)
          test -n "$APP_ID" && test -n "$INST_ID"
          echo "DEVID_APP=$APP_ID"       >> "$GITHUB_ENV"
          echo "DEVID_INSTALLER=$INST_ID" >> "$GITHUB_ENV"

      - name: Store notary credentials
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 -D > AuthKey.p8
          # Fail early with a clear message if the secret didn't decode to a real key
          # (notarytool would otherwise report a cryptic "invalidAsn1").
          openssl asn1parse -in AuthKey.p8 >/dev/null 2>&1 || {
            echo "::error::ASC_API_KEY_P8_BASE64 did not decode to a valid .p8 key. Re-set it with: openssl base64 -A -in AuthKey_XXXX.p8 | gh secret set ASC_API_KEY_P8_BASE64"
            exit 1
          }
          xcrun notarytool store-credentials xlate-notary \
            --key AuthKey.p8 --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
            --keychain "$KEYCHAIN"
          rm -f AuthKey.p8

      - name: Build, sign, notarize, staple
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          SIGN=1 \
          VERSION="$VERSION" \
          DEVID_APP="$DEVID_APP" \
          DEVID_INSTALLER="$DEVID_INSTALLER" \
          NOTARY_PROFILE="xlate-notary" \
          SIGN_KEYCHAIN="$KEYCHAIN" \
          SIGN_KEYCHAIN_PASSWORD="$KEYCHAIN_PASSWORD" \
          packaging/build_pkg.sh

      # Drop the signing identities before any third-party code runs, and on failure.
      - name: Delete signing keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" || true

      # The repo is public, so releases/latest/download/Xlate.pkg is a stable
      # anonymous download link.
      - name: Stable-named copy
        run: cp "packaging/dist/Xlate-${VERSION}.pkg" "packaging/dist/Xlate.pkg"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          generate_release_notes: true
          files: |
            packaging/dist/Xlate-${{ env.VERSION }}.pkg
            packaging/dist/Xlate.pkg
